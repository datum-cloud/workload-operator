name: Publish Docker Image

on:
  push:
  release:
    types: ['published']

jobs:
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: compute
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # Deployed as a Component (config/components/consumer-ui-plugin) folded
  # into compute-manager's own kustomize bundle/Flux Kustomization — no
  # separate bundle for this image.
  publish-consumer-ui-plugin-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: compute-consumer-ui-plugin
      context: ui/consumer
      dockerfile-path: ui/consumer/Dockerfile
    secrets: inherit

  # Deployed as a Component (config/components/provider-ui-plugin) folded
  # into compute-manager's own kustomize bundle/Flux Kustomization — same
  # shape as the consumer plugin above, just for staff-portal's
  # ProviderPortalPlugin instead of cloud-portal's ConsumerPortalPlugin.
  publish-provider-ui-plugin-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: compute-provider-ui-plugin
      context: ui/provider
      dockerfile-path: ui/provider/Dockerfile
    secrets: inherit

  # Stamps compute's own apiserver image (config/base/manager), both UI plugin
  # images (config/components/{consumer,provider}-ui-plugin) and the MCP server
  # (config/components/compute-mcp) into one compute-kustomize bundle publish.
  # The `images:` input (v1.20.0+) supports multiple {path, name, tag} entries
  # in one invocation — the single image-name/image-overlays inputs it replaces
  # can only stamp one image across N paths, which can't express "three
  # different images, four different paths" at all.
  #
  # compute-mcp is stamped with the manager's image and the manager's tag: one
  # image carries both binaries, so the two paths cannot name different builds.
  publish-kustomize-bundles:
    needs:
      [
        publish-container-image,
        publish-consumer-ui-plugin-image,
        publish-provider-ui-plugin-image,
      ]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.20.0
    with:
      bundle-name: ghcr.io/datum-cloud/compute-kustomize
      bundle-path: config
      images: |
        - { path: config/base/manager, name: ghcr.io/datum-cloud/compute, tag: "${{ needs.publish-container-image.outputs.tag }}" }
        - { path: config/components/consumer-ui-plugin, name: ghcr.io/datum-cloud/compute-consumer-ui-plugin, tag: "${{ needs.publish-consumer-ui-plugin-image.outputs.tag }}" }
        - { path: config/components/provider-ui-plugin, name: ghcr.io/datum-cloud/compute-provider-ui-plugin, tag: "${{ needs.publish-provider-ui-plugin-image.outputs.tag }}" }
        - { path: config/components/compute-mcp, name: ghcr.io/datum-cloud/compute, tag: "${{ needs.publish-container-image.outputs.tag }}" }
    secrets: inherit
