                                  type: array
                              type: object
                            reclaimPolicy:
                              default: Delete
                              description: |-
                                What becomes of the interface, and its addresses, when the instance slot
                                it serves goes away.

                                Delete returns the addresses to IPAM, so an instance recreated later comes
