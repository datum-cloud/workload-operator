apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: compute
spec:
  serviceRef:
    name: compute
  phase: Published
  # Consumer-side portal plugin (cloud-portal): a read-only workloads
  # dashboard. Hosted internally only — config/components/consumer-ui-plugin
  # (folded into compute-manager's own Deployment set), never fronted by a
  # public Gateway/HTTPRoute. cloud-portal's server is the only caller, over
  # this in-cluster Service DNS name; the browser never talks to a plugin
  # origin directly. Cluster-local DNS means this same value is correct in
  # every environment the compute-manager component deploys to (no per-env
  # override needed, unlike an earlier draft of this that used a public,
  # staging-specific hostname).
  #
  # No caBundle needed: the plugin's CSI-issued server cert chains to
  # datum-control-plane-ca, which cloud-portal's Bun runtime already trusts
  # platform-wide via NODE_EXTRA_CA_CERTS (set in both its staging and
  # production Deployment env, pointing at the same datum-control-plane-
  # trust-bundle ConfigMap). withCaBundle() is a no-op when caBundle is
  # unset, so the fetch just falls through to that existing trust.
  # Provider-side portal plugin (staff-portal): registers Workload into the
  # /customers/resources merged list via a data-only portal.resource/platform
  # extension (no page code — staff-portal itself runs the search query).
  # Same internal-only hosting story as the consumer plugin above; no
  # visibility block — the ProviderPortalPlugin CRD has none, since
  # staff-portal has no per-project entitlement concept. Same NODE_EXTRA_CA_CERTS
  # reasoning as the consumer plugin — staff-portal's Deployment already
  # trusts datum-control-plane-ca platform-wide, so no caBundle needed here
  # either.
  userInterface:
    consumer:
      assets:
        baseURL: https://compute-consumer-ui-plugin.compute-system.svc.cluster.local
      visibility:
        entitlement: None
    provider:
      assets:
        baseURL: https://compute-provider-ui-plugin.compute-system.svc.cluster.local
  locations:
    supportedClasses:
    - datum-managed
  monitoredResourceTypes:
  - type: compute.datumapis.com/Instance
    displayName: Compute Instance
    description: A running compute instance, billed for the runtime class it runs in.
    gvk:
      group: compute.datumapis.com
      kind: Instance
    labels:
    - name: region
      description: The region where the instance is running.
    - name: tier
      description: The service tier of the instance.
    # Runtime class is a separate label rather than a reuse of `tier`. `tier`
    # names a commercial support tier and is also a common name for customer
    # workload labels, so an invoice line broken out by `tier` would be
    # ambiguous. Providers register the classes they serve, so compute cannot
    # name the values here. An instance that selects no class reports an empty
    # dimension, which the catch-all rate prices.
    - name: runtime_class
      description: >-
        The execution tier the instance runs in. Isolation, image
        compatibility, startup latency, and price differ per class.
  metrics:
  # Every instance meter declares the runtime_class dimension. A producer may
  # only attach a key declared here, and a rate may only match on a declared
  # dimension. Without the declaration, per-class rates cannot be expressed and
  # events carrying the class are quarantined.
  - name: compute.datumapis.com/instance/cpu-seconds
    displayName: Compute Instance CPU Seconds
    description: CPU seconds consumed by a running instance.
    kind: Cumulative
    unit: s
    dimensions:
    - runtime_class
  - name: compute.datumapis.com/instance/memory-seconds
    displayName: Compute Instance Memory Seconds
    description: Memory byte-seconds consumed by a running instance.
    kind: Cumulative
    unit: By.s
    dimensions:
    - runtime_class
  - name: compute.datumapis.com/instance/cpu-allocated
    displayName: Compute Instance CPU Allocated
    description: Number of vCPUs allocated to an instance.
    kind: Gauge
    unit: '{cpu}'
    dimensions:
    - runtime_class
  - name: compute.datumapis.com/instance/memory-allocated
    displayName: Compute Instance Memory Allocated
    description: Bytes of memory allocated to an instance.
    kind: Gauge
    unit: By
    dimensions:
    - runtime_class
  - name: compute.datumapis.com/instance/uptime-seconds
    displayName: Compute Instance Uptime
    description: Seconds the instance has been in a running state.
    kind: Cumulative
    unit: s
    dimensions:
    - runtime_class
  - name: compute.datumapis.com/workloads
    displayName: Compute Workloads
    description: Number of compute workloads.
    kind: Gauge
    unit: '{workload}'
  - name: compute.datumapis.com/instances
    displayName: Compute Instances
    description: Number of compute instances.
    kind: Gauge
    unit: '{instance}'
  - name: compute.datumapis.com/vcpus
    displayName: Compute vCPUs
    description: Number of vCPUs allocated across all instances.
    kind: Gauge
    unit: '{millicore}'
  - name: compute.datumapis.com/memory
    displayName: Compute Memory
    description: Memory allocated across all instances.
    kind: Gauge
    unit: MiB
  billing:
    consumerDestinations:
    - monitoredResourceType: compute.datumapis.com/Instance
      metrics:
      - compute.datumapis.com/instance/cpu-seconds
      - compute.datumapis.com/instance/memory-seconds
      - compute.datumapis.com/instance/cpu-allocated
      - compute.datumapis.com/instance/memory-allocated
      - compute.datumapis.com/instance/uptime-seconds
  # Quota stays pooled across runtime classes. Entitling a class separately
  # requires a registered resource type per class, because a ResourceClaim names
  # a flat resource type and is immutable once created. It also requires a fresh
  # grant for every existing project, and existing quota headroom does not carry
  # over. Revisit once the runtime_class dimension on the meters above and the
  # class label on each ResourceClaim show per-class consumption against the
  # pooled limits.
  quota:
    metricRules:
    - selector:
        apiGroup: compute.datumapis.com
        kind: Workload
      metricCosts:
        compute.datumapis.com/workloads: 1
    limits:
    - name: compute-workloads
      displayName: Workloads
      description: Maximum number of workloads that can be created within a project.
      metric: compute.datumapis.com/workloads
      consumerType:
        apiGroup: resourcemanager.miloapis.com
        kind: Project
      unit: instance
      defaultLimit: 1000
    - name: compute-instances
      displayName: Instances
      description: Maximum number of compute instances that can run within a project.
      metric: compute.datumapis.com/instances
      consumerType:
        apiGroup: resourcemanager.miloapis.com
        kind: Project
      unit: instance
      defaultLimit: 10
    - name: compute-vcpus
      displayName: vCPUs
      description: Maximum total vCPUs (in millicores) allocatable to instances within a project.
      metric: compute.datumapis.com/vcpus
      consumerType:
        apiGroup: resourcemanager.miloapis.com
        kind: Project
      unit: millicore
      defaultLimit: 40000
    - name: compute-memory
      displayName: Memory
      description: Maximum total memory (in MiB) allocatable to instances within a project.
      metric: compute.datumapis.com/memory
      consumerType:
        apiGroup: resourcemanager.miloapis.com
        kind: Project
      unit: MiB
      defaultLimit: 81920
