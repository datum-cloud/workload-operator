apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: compute
spec:
  # Every runtime class bills at the rate below. general-purpose carries higher
  # per-instance overhead and should cost more, but its price is set by overhead
  # measured on Datum hardware, and the class is not placeable until that
  # measurement exists.
  #
  # Per-class pricing cannot be added to these charges, because a published
  # charge is immutable field for field. It needs new charge names.
  charges:
    - name: compute.datumapis.com/instance/cpu-seconds
      chargeType: Usage
      currency: USD
      displayName: Compute vCPU
      usage:
        metricRef: compute.datumapis.com/instance/cpu-seconds
        pricingUnit: vcpu-second
        rates:
          - flat: "0.000014"
    - name: compute.datumapis.com/instance/memory-seconds
      chargeType: Usage
      currency: USD
      displayName: Compute Memory
      usage:
        metricRef: compute.datumapis.com/instance/memory-seconds
        pricingUnit: gib-second
        rates:
          - flat: "0.0000045"
