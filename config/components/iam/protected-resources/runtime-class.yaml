# The permission set is declared in full so that operators and providers can be
# granted write access. Customer-facing roles grant read access only, because
# customers select a runtime class rather than define one.
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: compute.datumapis.com-runtimeclass
spec:
  serviceRef:
    name: "compute.datumapis.com"
  kind: RuntimeClass
  plural: runtimeclasses
  singular: runtimeclass
  permissions:
    - list
    - get
    - watch
    - create
    - update
    - patch
    - delete
    - updateStatus
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
