# Deliberately unbound — do not add a Role, ClusterRole, or binding for this
# account. compute-mcp reads as the caller, using the bearer token off each
# request, so the asker's own RBAC is the single enforcement point; granting
# this account read access to Workloads would restore exactly the ambient
# authority that removes, for every tenant, one prompt injection away.
#
# The token is still mounted, and nothing reads it. The control plane's address
# and CA come from the kubeconfig the deployment supplies, and clientForToken
# strips every credential off that config before setting the caller's, so this
# account's token can never reach an API server. Leave it mounted or drop it as
# you like; what must not change is that no Role or binding is ever attached.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: compute-mcp
    app.kubernetes.io/name: compute-mcp
  name: compute-mcp
