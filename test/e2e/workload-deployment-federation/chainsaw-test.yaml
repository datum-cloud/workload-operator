apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-deployment-federation
spec:
  description: |
    Verifies that the WorkloadDeploymentFederator replicates a WorkloadDeployment
    from the project namespace (control-plane cluster) to the Karmada API server
    with the correct location label and PropagationPolicy.

    The federator follows the ns-<namespace-uid> convention for Karmada namespaces,
    matching the MappedNamespaceResourceStrategy used by NSO. The test derives
    the expected Karmada namespace dynamically from the Chainsaw test namespace UID.

    Verified:
    - WorkloadDeployment exists in Karmada at ns-<project-ns-uid>
    - Karmada copy carries label topology.datum.net/location: dfw
    - PropagationPolicy location-dfw exists in the Karmada namespace,
      selecting WDs by location and routing them to matching POP-cell clusters.

  template: true

  steps:
  - name: derive-ns-and-create-wd
    description: Derive Karmada namespace and create the WorkloadDeployment.
    try:
    - apply:
        file: workload-deployment.yaml

  - name: assert-wd-in-downstream
    description: Assert WorkloadDeployment federated to Karmada with location label.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            namespace: ($downstreamNS)
            name: test-federation-wd
            labels:
              topology.datum.net/location: dfw

  - name: assert-propagation-policy-in-downstream
    description: Assert PropagationPolicy created for location-dfw.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 30s
        resource:
          apiVersion: policy.karmada.io/v1alpha1
          kind: PropagationPolicy
          metadata:
            namespace: ($downstreamNS)
            name: location-dfw
          spec:
            # The federator emits three resource selectors, not one: the
            # WorkloadDeployment plus the always-on ConfigMap and Secret
            # referenced-data selectors that co-propagate companions to the cell.
            # Chainsaw matches list length exactly, so all three must be asserted.
            resourceSelectors:
            - apiVersion: compute.datumapis.com/v1alpha
              kind: WorkloadDeployment
              labelSelector:
                matchLabels:
                  topology.datum.net/location: dfw
            - apiVersion: v1
              kind: ConfigMap
              labelSelector:
                matchLabels:
                  compute.datumapis.com/referenced-data: "true"
            - apiVersion: v1
              kind: Secret
              labelSelector:
                matchLabels:
                  compute.datumapis.com/referenced-data: "true"
            placement:
              clusterAffinity:
                labelSelector:
                  matchLabels:
                    topology.datum.net/location: dfw
