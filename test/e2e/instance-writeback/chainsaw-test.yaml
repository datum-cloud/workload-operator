apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: instance-writeback
spec:
  description: |
    Verifies that the InstanceReconciler running in a POP-cell cluster writes
    Instance objects back to the Karmada API server after reconciling the Ready
    condition for the first time.

    Write-back convention (internal/controller/instance_controller.go):
    - The Instance is written to Karmada at the same namespace/name as the POP-cell Instance.
    - The identity labels are NOT derived from the cell's own cluster name. The
      write-back reads them from the hub ns-<uid> namespace, which the management
      federator stamped: meta.datumapis.com/upstream-cluster-name carries
      EncodeClusterName of the federating cluster ("single" here → "cluster-single")
      and meta.datumapis.com/upstream-namespace records the originating namespace.

    Note: this test requires the cell InstanceReconciler to be running in the DFW
    POP cell cluster with federation configured.

    Runtime prerequisites (see the setup phase): the write-back path errors
    unless the hub ns-<uid> namespace carries the two upstream-* labels above and
    the cell Instance carries the full set of linking labels the stateful control
    strategy stamps at creation. It is also owner-gated: the hub
    WorkloadDeployment named by the Instance must exist, because it becomes the
    in-cluster owner of the copy, and no hub deployment means no copy at all
    (datum-cloud/compute#218). This suite hand-crafts all three, where
    full-federation gets them from a real WorkloadDeployment.

  template: true

  steps:
  - name: setup-namespaces
    description: Create the Instance namespace in the DFW POP cell and Karmada.
    try:
    - script:
        content: |
          kubectl get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: instanceNS
          value: ($stdout)
    - script:
        env:
        - name: INSTANCE_NS
          value: ($instanceNS)
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/pop-dfw.yaml \
            create namespace "$INSTANCE_NS" \
            --dry-run=client -o yaml | \
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/pop-dfw.yaml apply -f -
    - script:
        env:
        - name: INSTANCE_NS
          value: ($instanceNS)
        content: |
          # The cell write-back reads its identity (upstream cluster + project
          # namespace) from THIS hub namespace's labels, exactly as it would from
          # the ns-<uid> namespace the federator stamps in the real path. Seed them
          # so writeBackToUpstream can resolve identity instead of erroring.
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/downstream.yaml apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${INSTANCE_NS}
            labels:
              meta.datumapis.com/upstream-cluster-name: cluster-single
              meta.datumapis.com/upstream-namespace: ${INSTANCE_NS}
          EOF
    cleanup:
    - script:
        env:
        - name: INSTANCE_NS
          value: ($instanceNS)
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/pop-dfw.yaml \
            delete namespace "$INSTANCE_NS" --ignore-not-found
    - script:
        env:
        - name: INSTANCE_NS
          value: ($instanceNS)
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/downstream.yaml \
            delete namespace "$INSTANCE_NS" --ignore-not-found

  - name: seed-hub-workload-deployment
    description: |
      Create the hub WorkloadDeployment that owns the write-back copy. Write-back
      is gated on it: without it the cell correctly writes nothing.
    try:
    - script:
        content: |
          kubectl get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: instanceNS
          value: ($stdout)
    - script:
        env:
        - name: INSTANCE_NS
          value: ($instanceNS)
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/downstream.yaml apply -f - <<EOF
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            name: test-writeback-wd
            namespace: ${INSTANCE_NS}
          spec:
            locationRef:
              name: dfw
            placementName: default
            workloadRef:
              name: test-workload
              uid: "00000000-0000-0000-0000-000000000001"
            template:
              spec:
                runtime:
                  resources:
                    instanceType: datumcloud/d1-standard-2
                networkInterfaces:
                - network:
                    name: test-network
            scaleSettings:
              minReplicas: 1
          EOF

  - name: create-instance-on-pop-dfw
    description: Create the Instance on the DFW POP cell cluster.
    cluster: pop-dfw
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: instanceNS
          value: ($stdout)
    - apply:
        file: instance-pop-dfw.yaml
    cleanup:
    - script:
        content: |
          INSTANCE_NS=$(kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}')
          kubectl delete instance test-writeback-instance \
            --namespace "$INSTANCE_NS" --ignore-not-found

  - name: assert-instance-in-downstream
    description: Wait for the InstanceReconciler to write back the Instance to Karmada.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: instanceNS
          value: ($stdout)
    - assert:
        timeout: 120s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($instanceNS)
            name: test-writeback-instance
            labels:
              meta.datumapis.com/upstream-cluster-name: cluster-single
              meta.datumapis.com/upstream-namespace: ($instanceNS)
            # The copy is owned by the hub WorkloadDeployment it names, so the
            # hub garbage collector reclaims it when that deployment goes away.
            (ownerReferences[?kind == 'WorkloadDeployment'] | [0]):
              name: test-writeback-wd
              controller: true
