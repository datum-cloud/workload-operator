apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: full-federation-ord
spec:
  description: |
    Second-cell federation chain test (city code ord → pop-ord).

    The dfw path is covered by full-federation. This suite proves the same chain
    routes independently to the OTHER cell: an ord-placed WorkloadDeployment must
    produce PropagationPolicy location-ord (not location-dfw), propagate to pop-ord (not
    pop-dfw), and create its Instance on pop-ord. Both cells run the same operator
    image, so this is the coverage that catches location routing regressions and
    a mis-registered second cell.

    1. Create WorkloadDeployment (locationRef.name: ord) on control-plane.
    2. WorkloadDeploymentFederator replicates it to Karmada (ns-<uid> namespace)
       and lazily creates PropagationPolicy location-ord routing to location=ord cells.
    3. Karmada propagates the WD to pop-ord.
    4. WorkloadDeploymentReconciler on pop-ord creates Instance test-fullfed-ord-wd-0.
    5. InstanceReconciler on pop-ord writes the Instance back to Karmada with
       label meta.datumapis.com/upstream-cluster-name: cluster-single.
    6. InstanceProjector on control-plane projects the Instance into the project
       namespace.

    Cluster-name label "cluster-single" is the management operator's federating
    cluster name, not the cell's — see full-federation for the full rationale.

    Prerequisites: the management + both cell operators are deployed in-cluster
    (task e2e:up).

  template: true

  steps:
  - name: create-workload-deployment
    description: Create the ord-placed WorkloadDeployment on the control-plane cluster.
    try:
    - apply:
        file: workload-deployment.yaml

  - name: assert-wd-and-policy-in-downstream
    description: Assert the WD federated to Karmada and PropagationPolicy location-ord was created for ord.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 120s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            namespace: ($downstreamNS)
            name: test-fullfed-ord-wd
            labels:
              topology.datum.net/location: ord
    - assert:
        # The federator names the policy location-<name> and routes it to cells
        # carrying the same location label, so ord must land on pop-ord alone.
        timeout: 120s
        resource:
          apiVersion: policy.karmada.io/v1alpha1
          kind: PropagationPolicy
          metadata:
            namespace: ($downstreamNS)
            name: location-ord
          spec:
            # Three selectors: the WorkloadDeployment plus the always-on ConfigMap
            # and Secret referenced-data selectors. Chainsaw matches list length
            # exactly, so all three must be present.
            resourceSelectors:
            - apiVersion: compute.datumapis.com/v1alpha
              kind: WorkloadDeployment
              labelSelector:
                matchLabels:
                  topology.datum.net/location: ord
            - apiVersion: v1
              kind: ConfigMap
              labelSelector:
                matchLabels:
                  compute.datumapis.com/referenced-data: "true"
            - apiVersion: v1
              kind: Secret
              labelSelector:
                matchLabels:
                  compute.datumapis.com/referenced-data: "true"
            placement:
              clusterAffinity:
                labelSelector:
                  matchLabels:
                    topology.datum.net/location: ord

  - name: assert-wd-on-pop-ord
    description: Assert Karmada propagated the WD to pop-ord and the cell reconciler set status.
    cluster: pop-ord
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        # Karmada propagation can take longer than a local apply.
        timeout: 60s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: WorkloadDeployment
          metadata:
            namespace: ($downstreamNS)
            name: test-fullfed-ord-wd
          status:
            replicas: 1
            desiredReplicas: 1

  - name: assert-instance-on-pop-ord
    description: Assert WorkloadDeploymentReconciler created an Instance on pop-ord.
    cluster: pop-ord
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($downstreamNS)
            name: test-fullfed-ord-wd-0
          # The Instance is blocked before scheduling completes (a scheduling
          # gate, or no matching Location in the e2e environment), so Ready is
          # definitively False — not indeterminate. The exact reason is
          # environment-dependent, so only the status is asserted.
          (status.conditions[?type == 'Ready'] | [0]):
            status: "False"

  - name: assert-instance-writeback-in-downstream
    description: Assert the pop-ord InstanceReconciler wrote the Instance back to Karmada.
    cluster: downstream
    try:
    - script:
        content: |
          kubectl --kubeconfig=../../../tmp/e2e/kubeconfigs/control-plane.yaml \
            get namespace "$NAMESPACE" \
            -o template='{{printf "ns-%s" .metadata.uid}}'
        outputs:
        - name: downstreamNS
          value: ($stdout)
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($downstreamNS)
            name: test-fullfed-ord-wd-0
            labels:
              meta.datumapis.com/upstream-cluster-name: cluster-single

  - name: assert-instance-projected-to-control-plane
    description: Assert InstanceProjector created a projection on the control-plane.
    try:
    - assert:
        timeout: 30s
        resource:
          apiVersion: compute.datumapis.com/v1alpha
          kind: Instance
          metadata:
            namespace: ($namespace)
            name: test-fullfed-ord-wd-0
            labels:
              meta.datumapis.com/upstream-cluster-name: cluster-single
          # The Instance is blocked before scheduling completes (a scheduling
          # gate, or no matching Location in the e2e environment), so Ready is
          # definitively False — not indeterminate. The exact reason is
          # environment-dependent, so only the status is asserted.
          (status.conditions[?type == 'Ready'] | [0]):
            status: "False"
