apiVersion: compute.datumapis.com/v1alpha
kind: WorkloadDeployment
metadata:
  name: test-pullsecret-wd
  # namespace injected by Chainsaw from ($namespace)
spec:
  locationRef:
    name: dfw
  placementName: default
  workloadRef:
    name: test-workload
    uid: "00000000-0000-0000-0000-000000000004"
  template:
    spec:
      runtime:
        resources:
          instanceType: datumcloud/d1-standard-2
        sandbox:
          # Explicit empty list, not an omitted field: chainsaw applies a merge
          # patch, so an absent key would leave the existing entry in place.
          imagePullSecrets: []
          containers:
          - name: app
            image: docker.io/library/busybox:stable
            volumeAttachments:
            - name: config-vol
              mountPath: /etc/config
      volumes:
      - name: config-vol
        configMap:
          name: pullsecret-app-config
      networkInterfaces:
      - network:
          name: test-network
  scaleSettings:
    minReplicas: 1
